name: Quality gate

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - feature/multiprovider-and-polish
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate workflow YAML
        run: dart run tool/check_workflows.dart

      - name: Analyze
        run: flutter analyze

      - name: Test repository-tool source fallback
        run: flutter test test/check_tag_sync_test.dart

      - name: Precompile repository tools
        shell: bash
        run: bash tool/build_tools.sh

      - name: Test
        run: flutter test
