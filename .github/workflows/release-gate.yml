name: Release gate - signing backup

permissions:
  contents: read

# Every release must be backed up before it is signed. This gate runs on
# version tags (v*) and fails the run when the signing-key backup receipt
# (.ci/signing-backup-receipt.json) is missing, stale (older than
# BACKUP_MAX_AGE_DAYS, default 30), or out of sync with the trusted keys baked
# into the app — prompting a fresh backup before any manifest is signed.
#
# The receipt holds only fingerprints and timestamps, never key material: it
# is produced by `dart run tool/backup_signing_key.dart` (which also writes
# the password-manager entry and the encrypted offline copy), and must be
# committed alongside the backup. The actual private key never enters CI.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-signing-backup:
    name: Verify signing-key backup receipt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history + tags so a retirement can be validated against the
          # previous release tag.
          fetch-depth: 0

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Check all workflow files parse
        shell: bash
        # A workflow whose YAML does not parse is silently ignored by GitHub —
        # this tag's own pipeline would never run. Fail the gate before
        # anything else.
        run: |
          set -euo pipefail
          bash tool/build_tools.sh
          ./build/tools/check_workflows --dir .github/workflows

      - name: Check tag / main / manifest-branch sync
        shell: bash
        env:
          MANIFEST_BRANCH: ${{ vars.MANIFEST_BRANCH || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The tag is the release artifact: main must equal the tag, the
          # branch serving updates.json must contain the tag (equal or ahead -
          # publishes move it forward), and the tag must carry the release
          # workflows (otherwise this tag's own pipeline can't run).
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "workflow_dispatch: tag sync tidak dapat diverifikasi - dilewati."
            exit 0
          fi
          git fetch origin --tags --prune
          ./build/tools/check_tag_sync \
            --tag "${{ github.ref_name }}" \
            --main main \
            --branch "$MANIFEST_BRANCH"

      - name: Check backup receipt (missing / stale / out-of-sync)
        shell: bash
        env:
          BACKUP_MAX_AGE_DAYS: ${{ vars.BACKUP_MAX_AGE_DAYS || '30' }}
        run: |
          set -euo pipefail
          dart tool/check_backup_receipt.dart \
            --receipt .ci/signing-backup-receipt.json \
            --max-age-days "$BACKUP_MAX_AGE_DAYS"

      - name: Validate key retirement vs previous release
        shell: bash
        # If this release drops a key from updateSigningPublicKeys relative to
        # the previous tag, it must satisfy the retire preconditions (nightly
        # margin history fresh + enough rows, surviving key verifies the
        # manifest). Catches retirements that skip the retire-key workflow.
        run: |
          set -euo pipefail
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          if [ -z "$PREV_TAG" ]; then
            echo "No previous release tag - nothing to validate."
            exit 0
          fi
          extract_keys() {
            sed -n '/updateSigningPublicKeys = <String>\[/,/^\];/p' "$1" \
              | grep -oE "'[A-Za-z0-9+/]{40,}={0,2}'" | tr -d "'"
          }
          CURRENT="$(mktemp)"
          PREV="$(mktemp)"
          trap 'rm -f "$CURRENT" "$PREV" /tmp/prev_service.dart' EXIT
          extract_keys lib/services/update_service.dart > "$CURRENT"
          if ! git show "$PREV_TAG:lib/services/update_service.dart" \
              > /tmp/prev_service.dart 2>/dev/null; then
            echo "Previous tag has no service file - nothing to validate."
            exit 0
          fi
          extract_keys /tmp/prev_service.dart > "$PREV"
          RETIRED=0
          while IFS= read -r key; do
            if ! grep -qxF "$key" "$CURRENT"; then
              echo "Detected retired key vs $PREV_TAG: $key"
              dart tool/retire_signing_key.dart \
                --retire "$key" --history .ci/dap-load-history.csv
              RETIRED=1
            fi
          done < "$PREV"
          if [ "$RETIRED" = "0" ]; then
            echo "No key retired in this release."
          fi
          echo "Retirement validation PASS"
